<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | MyBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="brand-mark">MB</div>
        <p class="eyebrow">MYBANK</p>
        <h1>Welcome back</h1>
        <p class="text-secondary mb-4">Sign in to securely manage your accounts.</p>

        <div class="alert alert-success" th:if="${param.registered}">
            Registration complete. You can now sign in.
        </div>
        <div class="alert alert-info" th:if="${param.logout}">
            You have been logged out safely.
        </div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" id="email" type="email" th:field="*{email}"
                       placeholder="you@example.com" autocomplete="email">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" th:field="*{password}"
                       placeholder="Enter your password" autocomplete="current-password">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            New to MyBank? <a th:href="@{/register}">Create an account</a>
        </p>
    </section>
</main>
</body>
</html>
