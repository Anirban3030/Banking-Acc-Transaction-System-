<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | MyBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="brand-mark">MB</div>
        <p class="eyebrow">MYBANK</p>
        <h1>Create your account</h1>
        <p class="text-secondary mb-4">Start managing your money with confidence.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="name">Full name</label>
                <input class="form-control" id="name" type="text" th:field="*{name}"
                       placeholder="Your full name" autocomplete="name">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" id="email" type="email" th:field="*{email}"
                       placeholder="you@example.com" autocomplete="email">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone number</label>
                <input class="form-control" id="phone" type="tel" th:field="*{phone}"
                       placeholder="Your phone number" autocomplete="tel">
                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" th:field="*{password}"
                       placeholder="At least 6 characters" autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Already registered? <a th:href="@{/login}">Sign in</a>
        </p>
    </section>
</main>
</body>
</html>
