<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${operation + ' money | MyBank'}">Deposit money | MyBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page">
<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand brand-link" th:href="@{/dashboard}">
            <span class="brand-mark brand-mark-small">MB</span> MyBank
        </a>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <a class="small" th:href="@{/accounts/{id}(id=${account.id})}">← Back to account</a>
    <div class="operation-shell mt-4">
        <div class="content-card">
            <p class="eyebrow mb-1">ACCOUNT OPERATION</p>
            <h1 class="display-6 fw-bold mb-2" th:text="${operation + ' money'}">Deposit money</h1>
            <p class="text-secondary mb-4"
               th:text="${account.accountType + ' •••• ' + #strings.substring(account.accountNumber, account.accountNumber.length() - 4)}">
                SAVINGS •••• 1234
            </p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="operation-balance mb-4">
                <span class="small text-secondary">Current balance</span>
                <strong th:text="${'₹' + #numbers.formatDecimal(account.balance, 1, 2)}">₹0.00</strong>
            </div>

            <form th:action="${operation == 'Deposit' ? '/accounts/' + account.id + '/deposit' : '/accounts/' + account.id + '/withdraw'}"
                  th:object="${amountRequest}" method="post" novalidate>
                <div class="mb-4">
                    <label class="form-label" for="amount">Amount</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">₹</span>
                        <input class="form-control" id="amount" type="number" step="0.01" min="0.01"
                               th:field="*{amount}" placeholder="0.00" autofocus>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                </div>
                <button class="btn btn-primary w-100" type="submit"
                        th:text="${operation == 'Deposit' ? 'Deposit money' : 'Withdraw money'}">
                    Deposit money
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
