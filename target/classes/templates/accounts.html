<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Accounts | MyBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page">
<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand brand-link" th:href="@{/dashboard}">
            <span class="brand-mark brand-mark-small">MB</span> MyBank
        </a>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <a class="small" th:href="@{/dashboard}">← Back to dashboard</a>
    <div class="d-flex justify-content-between align-items-end mb-4 mt-3">
        <div>
            <p class="eyebrow mb-1">YOUR MONEY</p>
            <h1 class="display-6 fw-bold mb-2">My accounts</h1>
            <p class="text-secondary mb-0">View balances and manage your banking accounts.</p>
        </div>
        <span class="text-secondary small" th:text="${#lists.size(accounts) + ' account(s)'}">1 account</span>
    </div>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-xl-4" th:each="account : ${accounts}">
            <article class="content-card account-card h-100">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <span class="metric-icon">AC</span>
                    <span class="status-pill" th:text="${account.status}">ACTIVE</span>
                </div>
                <p class="text-secondary small mb-1" th:text="${account.accountType}">SAVINGS</p>
                <h2 class="h4 mb-1"
                    th:text="${'•••• ' + #strings.substring(account.accountNumber, account.accountNumber.length() - 4)}">
                    •••• 1234
                </h2>
                <div class="display-6 fw-bold mb-4"
                     th:text="${'₹' + #numbers.formatDecimal(account.balance, 1, 2)}">₹0.00</div>
                <a class="btn btn-primary w-100" th:href="@{/accounts/{id}(id=${account.id})}">
                    View account details
                </a>
            </article>
        </div>
    </div>

    <div class="empty-state content-card mt-4" th:if="${#lists.isEmpty(accounts)}">
        No accounts are available for this customer.
    </div>
</main>
</body>
</html>
