<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transfer Money | MyBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page">
<nav class="navbar bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand brand-link" th:href="@{/dashboard}">
            <span class="brand-mark brand-mark-small">MB</span> MyBank
        </a>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<main class="container py-4 py-lg-5">
    <a class="small" th:href="@{/dashboard}">← Back to dashboard</a>
    <div class="operation-shell mt-4">
        <div class="content-card">
            <p class="eyebrow mb-1">BANKING OPERATION</p>
            <h1 class="display-6 fw-bold mb-2">Transfer money</h1>
            <p class="text-secondary mb-4">
                Move money securely from one account to another.
            </p>

            <div class="alert alert-success" th:if="${param.success}">
                Transfer completed successfully.
            </div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/transfer}" th:object="${transferRequest}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="fromAccountId">From account</label>
                    <select class="form-select form-select-lg" id="fromAccountId"
                            th:field="*{fromAccountId}">
                        <option value="">Select your account</option>
                        <option th:each="account : ${accounts}"
                                th:value="${account.id}"
                                th:text="${account.accountType + ' •••• ' + #strings.substring(account.accountNumber, account.accountNumber.length() - 4) + ' — ₹' + #numbers.formatDecimal(account.balance, 1, 2)}">
                            SAVINGS •••• 1234 — ₹0.00
                        </option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('fromAccountId')}"
                         th:errors="*{fromAccountId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="toAccountId">Destination account ID</label>
                    <input class="form-control form-control-lg" id="toAccountId" type="number"
                           th:field="*{toAccountId}" placeholder="Enter destination account ID">
                    <div class="form-text">
                        Use the destination account ID provided by the recipient.
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('toAccountId')}"
                         th:errors="*{toAccountId}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="amount">Amount</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">₹</span>
                        <input class="form-control" id="amount" type="number" step="0.01" min="0.01"
                               th:field="*{amount}" placeholder="0.00">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('amount')}"
                         th:errors="*{amount}"></div>
                </div>

                <button class="btn btn-primary w-100" type="submit">Transfer money</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
